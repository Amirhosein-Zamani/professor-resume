name: ${COMPOSE_PROJECT_NAME:-professor-resume}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: ./api
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL is required}
      SEED_SECONDARY_ADMIN_EMAIL: ${SEED_SECONDARY_ADMIN_EMAIL:-}
      SEED_AUTHOR_EMAIL: ${SEED_AUTHOR_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  api:
    build:
      context: ./api
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      COOKIE_ACCESS_NAME: ${COOKIE_ACCESS_NAME:-atkn}
      COOKIE_REFRESH_NAME: ${COOKIE_REFRESH_NAME:-rtkn}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?OTP_HASH_SECRET is required}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      OTP_RATE_LIMIT_WINDOW_SECONDS: ${OTP_RATE_LIMIT_WINDOW_SECONDS:-900}
      OTP_RATE_LIMIT_EMAIL_MAX: ${OTP_RATE_LIMIT_EMAIL_MAX:-3}
      OTP_RATE_LIMIT_IP_MAX: ${OTP_RATE_LIMIT_IP_MAX:-10}
      OTP_VERIFY_RATE_LIMIT_EMAIL_MAX: ${OTP_VERIFY_RATE_LIMIT_EMAIL_MAX:-5}
      OTP_VERIFY_RATE_LIMIT_IP_MAX: ${OTP_VERIFY_RATE_LIMIT_IP_MAX:-20}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS is required}
      SMTP_FROM: ${SMTP_FROM:-}
      GOLESTAN_BASE_URL: ${GOLESTAN_BASE_URL:-}
      GOLESTAN_LOGIN: ${GOLESTAN_LOGIN:-}
      GOLESTAN_PASS: ${GOLESTAN_PASS:-}
      GOLESTAN_SEC: ${GOLESTAN_SEC:-}
      GOLESTAN_RATE_LIMIT_WINDOW_SECONDS: ${GOLESTAN_RATE_LIMIT_WINDOW_SECONDS:-300}
      GOLESTAN_RATE_LIMIT_MAX: ${GOLESTAN_RATE_LIMIT_MAX:-5}
    volumes:
      - api_assets:/app/assets
    ports:
      - ${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-4000}:4000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./web
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      AUTH_REFRESH_COOKIE_NAME: ${COOKIE_REFRESH_NAME:-rtkn}
    ports:
      - ${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3000}:3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  api_assets:
